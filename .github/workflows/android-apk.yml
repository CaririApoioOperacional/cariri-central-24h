name: Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore production signing key
        env:
          KEYSTORE_B64: ${{ secrets.CARIRI_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64"
          echo "$KEYSTORE_B64" | base64 --decode > app/cariri-production.jks
      - name: Build signed production APK
        env:
          CARIRI_KEYSTORE_PATH: cariri-production.jks
          CARIRI_KEYSTORE_PASSWORD: ${{ secrets.CARIRI_ANDROID_KEYSTORE_PASSWORD }}
          CARIRI_KEY_ALIAS: ${{ secrets.CARIRI_ANDROID_KEY_ALIAS }}
          CARIRI_KEY_PASSWORD: ${{ secrets.CARIRI_ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: CARIRI-CENTRAL-24h-PRODUCAO
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Publish official update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep 'versionName=' app/build.gradle.kts | sed -E 's/.*versionName="([^"]+)".*/\1/')
          TAG="android-v$VERSION"
          cp app/build/outputs/apk/release/app-release.apk /tmp/CARIRI-CENTRAL-24h.apk
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" /tmp/CARIRI-CENTRAL-24h.apk --clobber
          else
            gh release create "$TAG" /tmp/CARIRI-CENTRAL-24h.apk --title "CARIRI CENTRAL 24h v$VERSION" --notes "Versão oficial assinada do aplicativo CARIRI CENTRAL 24h." --latest
          fi
